<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SporshyoCraft 🎮</title>

<style>
body {
    margin: 0;
    font-family: 'Courier New', monospace;
    background: url('https://i.imgur.com/t9Q9QpG.png'); /* block texture */
    color: white;
    text-align: center;
}

/* overlay */
.overlay {
    background: rgba(0,0,0,0.7);
    height: 100vh;
    padding-top: 80px;
}

/* big title */
.title {
    font-size: 60px;
    text-shadow: 4px 4px black;
}

/* subtitle */
.subtitle {
    font-size: 20px;
    color: #7CFC00;
}

/* button */
.btn {
    display: inline-block;
    padding: 15px 30px;
    margin-top: 25px;
    background: #7CFC00;
    color: black;
    border: 4px solid #2e7d32;
    text-decoration: none;
    font-weight: bold;
    cursor: pointer;
}

.btn:hover {
    background: #32CD32;
    transform: translateY(4px);
}

/* panel */
.panel {
    margin: 30px auto;
    width: 300px;
    padding: 20px;
    background: #3e2723;
    border: 4px solid #1b5e20;
}

/* hidden message */
#secret {
    display: none;
    margin-top: 20px;
    color: #7CFC00;
}

/* floating blocks */
.block {
    position: absolute;
    width: 20px;
    height: 20px;
    background: #8BC34A;
    animation: fall linear infinite;
}

@keyframes fall {
    0% {transform: translateY(-10vh);}
    100% {transform: translateY(110vh);}
}
</style>
</head>

<body>

<div class="overlay">

    <div class="title">⛏️ SPORSHYOCRAFT ⛏️</div>
    <div class="subtitle">A Custom World Built For Sporshyo</div>

    <div class="panel">
        <h2>Mission</h2>
        <p>Explore the world. Survive the vibes. Stay legendary.</p>
    </div>

    <div class="btn" onclick="enterWorld()">ENTER WORLD</div>

    <div id="secret">🎉 Secret unlocked: You are the MVP of this world 🏆</div>

</div>

<script>
function enterWorld(){
    document.getElementById("secret").style.display = "block";
}

/* falling blocks effect */
for(let i=0;i<40;i++){
    let b = document.createElement("div");
    b.className = "block";
    b.style.left = Math.random()*100 + "vw";
    b.style.animationDuration = (3 + Math.random()*5) + "s";
    document.body.appendChild(b);
}
</script>

</body>
</html>
